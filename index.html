<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLICQR</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Montserrat',sans-serif;
background:black;
overflow-x:hidden;
color:white;
}

/* Animated Background */

.background{
position:fixed;
width:100%;
height:100vh;
overflow:hidden;
z-index:-1;
background:linear-gradient(135deg,#050816,#0b1026,#130f40);
}

.blob{
position:absolute;
border-radius:50%;
filter:blur(90px);
animation:float 10s infinite ease-in-out;
opacity:0.7;
}

.blob1{
width:300px;
height:300px;
background:#00f7ff;
top:10%;
left:5%;
}

.blob2{
width:350px;
height:350px;
background:#ff00ff;
bottom:5%;
right:5%;
animation-delay:2s;
}

.blob3{
width:250px;
height:250px;
background:#7b61ff;
top:50%;
left:40%;
animation-delay:4s;
}

@keyframes float{
0%{transform:translateY(0px) translateX(0px);}
50%{transform:translateY(-40px) translateX(20px);}
100%{transform:translateY(0px) translateX(0px);}
}

/* Navbar */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 50px;
position:sticky;
top:0;
backdrop-filter:blur(12px);
background:rgba(255,255,255,0.05);
}

.logo{
font-family:'Orbitron',sans-serif;
font-size:42px;
letter-spacing:8px;
background:linear-gradient(90deg,#00f7ff,#ffffff,#ff00ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
text-shadow:0 0 25px rgba(255,255,255,0.4);
animation:glow 3s infinite alternate;
}

@keyframes glow{
from{filter:drop-shadow(0 0 5px #00f7ff);}
to{filter:drop-shadow(0 0 20px #ff00ff);}
}

nav a{
color:white;
text-decoration:none;
margin-left:25px;
font-size:16px;
transition:0.3s;
}

nav a:hover{
color:#00f7ff;
}

/* Hero */

.hero{
height:90vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero h1{
font-size:70px;
font-family:'Orbitron',sans-serif;
margin-bottom:15px;
animation:fadeUp 1.5s ease;
}

.hero p{
font-size:20px;
max-width:700px;
opacity:0.8;
animation:fadeUp 2s ease;
}

.btn{
margin-top:30px;
padding:15px 35px;
border:none;
border-radius:40px;
background:linear-gradient(90deg,#00f7ff,#7b61ff,#ff00ff);
color:white;
font-size:17px;
cursor:pointer;
transition:0.4s;
box-shadow:0 0 20px rgba(0,247,255,0.5);
}

.btn:hover{
transform:translateY(-6px) scale(1.05);
box-shadow:0 0 35px rgba(255,0,255,0.7);
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}
}

/* Floating Product Cards */

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:30px;
padding:60px 40px;
}

.card{
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(15px);
border-radius:20px;
padding:20px;
text-align:center;
transition:0.5s;
animation:cardFloat 5s infinite ease-in-out;
}

.card:nth-child(2){
animation-delay:1s;
}

.card:nth-child(3){
animation-delay:2s;
}

@keyframes cardFloat{
0%{transform:translateY(0px);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0px);}
}

.card:hover{
transform:scale(1.05) rotateX(5deg);
box-shadow:0 0 30px rgba(0,247,255,0.4);
}

.card img{
width:100%;
border-radius:15px;
}

.card h3{
margin-top:15px;
font-size:22px;
}

.card p{
margin:10px 0;
opacity:0.8;
}

.buy-btn{
padding:10px 20px;
border:none;
border-radius:25px;
background:#00f7ff;
color:black;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.buy-btn:hover{
transform:scale(1.08);
}

footer{
text-align:center;
padding:30px;
opacity:0.7;
}

/* Mobile */

@media(max-width:768px){

.hero h1{
font-size:42px;
}

.hero p{
font-size:16px;
}

nav{
display:none;
}

header{
padding:20px;
}

.logo{
font-size:28px;
letter-spacing:4px;
}

}

</style>
</head>

<body>

<div class="background">
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
</div>

<header>
<div class="logo">CLICQR</div>

<nav>
<a href="#">Home</a>
<a href="#">Shop</a>
<a href="#">About</a>
<a href="#">Contact</a>
</nav>
</header>

<section class="hero">
<h1>ANTI‑GRAVITY FASHION</h1>
<p>Luxury futuristic streetwear powered by futuristic motion and immersive design.</p>
<button class="btn">Explore Collection</button>
</section>

<section class="products">

<div class="card">
<img src="https://via.placeholder.com/300x350">
<h3>Oversized Tee</h3>
<p>₹499</p>
<button class="buy-btn">Buy Now</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x350">
<h3>Street Hoodie</h3>
<p>₹999</p>
<button class="buy-btn">Buy Now</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x350">
<h3>Luxury Jacket</h3>
<p>₹1499</p>
<button class="buy-btn">Buy Now</button>
</div>

</section>

<footer>
© 2026 CLICQR — Future Of Fashion
</footer>

</body>
</html>
