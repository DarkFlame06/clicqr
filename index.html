<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clicqr</title><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:linear-gradient(-45deg,#ff512f,#dd2476,#24c6dc,#514a9d);
background-size:400% 400%;
animation:gradientBG 12s ease infinite;
color:white;
}

/* Animated background */

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Header */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
}

.logo{
font-size:28px;
font-weight:bold;
letter-spacing:2px;
}

nav a{
color:white;
margin-left:20px;
text-decoration:none;
font-size:16px;
}

/* Hero section */

.hero{
height:80vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
animation:fadeUp 1.5s ease;
}

.hero h1{
font-size:55px;
margin-bottom:10px;
}

.hero p{
font-size:18px;
opacity:0.9;
}

.btn{
margin-top:25px;
padding:14px 28px;
border:none;
border-radius:30px;
background:white;
color:black;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

.btn:hover{
transform:scale(1.1);
}

/* Animation */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* Product section */

.products{
padding:60px 30px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
}

.card{
background:white;
color:black;
border-radius:12px;
padding:20px;
text-align:center;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
transition:0.3s;
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
border-radius:10px;
}

.card button{
margin-top:10px;
padding:10px 18px;
background:#dd2476;
border:none;
color:white;
border-radius:20px;
cursor:pointer;
}

/* Footer */

footer{
text-align:center;
padding:25px;
background:rgba(0,0,0,0.3);
}

/* Mobile */

@media(max-width:768px){

.hero h1{
font-size:34px;
}

nav{
display:none;
}

}

</style></head><body><header><div class="logo">CLICQR</div><nav>
<a href="#">Home</a>
<a href="#">Shop</a>
<a href="#">Contact</a>
</nav></header><section class="hero"><h1>Luxury Fashion</h1>
<p>Premium Clothing At Reasonable Prices</p><button class="btn">Shop Now</button>

</section><section class="products"><div class="card">
<img src="https://via.placeholder.com/300">
<h3>Oversized T-Shirt</h3>
<p>₹499</p>
<button>Buy</button>
</div><div class="card">
<img src="https://via.placeholder.com/300">
<h3>Street Hoodie</h3>
<p>₹999</p>
<button>Buy</button>
</div><div class="card">
<img src="https://via.placeholder.com/300">
<h3>Classic Shirt</h3>
<p>₹799</p>
<button>Buy</button>
</div></section><footer>
© 2026 Clicqr
</footer></body>
</html>
