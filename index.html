<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clicqr</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(120deg,#ff6a00,#ff2d55);
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:rgba(0,0,0,0.3);
}

.logo{
font-size:24px;
font-weight:bold;
}

nav a{
color:white;
margin:0 10px;
text-decoration:none;
font-size:16px;
}

.hero{
text-align:center;
padding:80px 20px;
}

.hero h1{
font-size:45px;
margin-bottom:10px;
}

.hero p{
font-size:18px;
}

.btn{
margin-top:20px;
padding:12px 25px;
background:white;
color:black;
border:none;
border-radius:25px;
font-size:16px;
cursor:pointer;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:25px;
padding:40px;
}

.card{
background:white;
color:black;
border-radius:12px;
padding:20px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.card img{
width:100%;
border-radius:10px;
}

.card h3{
margin:10px 0;
}

.card button{
padding:10px 18px;
background:#ff2d55;
border:none;
color:white;
border-radius:20px;
cursor:pointer;
}

footer{
text-align:center;
padding:20px;
background:rgba(0,0,0,0.4);
}

/* Mobile Responsive */

@media(max-width:768px){

.hero h1{
font-size:30px;
}

nav{
display:none;
}

}

</style>
</head>

<body>

<header>
<div class="logo">CLICQR</div>
<nav>
<a href="#">Home</a>
<a href="#">Products</a>
<a href="#">Contact</a>
</nav>
</header>

<section class="hero">
<h1>Luxury Fashion</h1>
<p>Premium Clothing At Reasonable Prices</p>
<button class="btn">Shop Now</button>
</section>

<section class="products">

<div class="card">
<img src="https://via.placeholder.com/300">
<h3>Oversized T-Shirt</h3>
<p>₹499</p>
<button>Buy</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/300">
<h3>Street Hoodie</h3>
<p>₹999</p>
<button>Buy</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/300">
<h3>Classic Shirt</h3>
<p>₹799</p>
<button>Buy</button>
</div>

</section>

<footer>
© 2026 Clicqr
</footer>

</body>
</html>
